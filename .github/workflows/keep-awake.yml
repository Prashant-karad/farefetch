# Render's free plan sleeps after 15 idle minutes; a light ping every 5 minutes keeps the live demo responsive.
name: keep-awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://fairfetch-xm1y.onrender.com/health || true
